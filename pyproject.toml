[project]
name = "bgbench"
version = "0.1.0"
description = "BGP propagation / blast-radius forecasting from onset — data pipeline, baselines, models"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "pybgpkit-parser>=0.18",
  "polars>=1.20",
  "pyarrow>=18",
  "duckdb>=1.1",
  "httpx>=0.27",
  "typer>=0.12",
  "numpy>=2.0",
  "scipy>=1.14",
  "orjson>=3.10",
]

[project.optional-dependencies]
workflow = ["snakemake>=9.26", "snakemake-executor-plugin-slurm>=2.8"]
dev = ["pytest>=8", "ruff>=0.6"]
plots = ["matplotlib>=3.9"]
tsfm = ["torch>=2.4", "chronos-forecasting>=2.0"]
ml = ["torch>=2.4", "torch-geometric>=2.6", "scikit-learn>=1.5"]

[project.scripts]
bgbench = "bgbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
